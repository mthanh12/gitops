apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fullstack-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mthanh12/gitops.git
    targetRevision: main
    path: k8s/fullstack-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
